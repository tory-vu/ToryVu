<!-- LƯỚI KHUNG DỰ ÁN SỬ DỤNG FLEXBOX ĐỂ CĂN GIỮA HÀNG CUỐI -->
<div class="portfolio-flex-layout">
    
    <!-- Dự án 1: Character -->
     
    <div class="portfolio-grid-item" data-category="character" onclick="openProjectVault('character', 'faye')">
        <a href="/artwork_chara.html">
        <div class="grid-image-wrapper">
            <img src="/character/Charater/witch.jpg" style="opacity:50%;" alt="Character Design">

        <div class="grid-item-overlay">
            <span>CHARACTER Design</span>
        </div>
        </a>
    </div>

    <!-- Dự án 2: Poster -->
    <div class="portfolio-grid-item" data-category="poster" onclick="openProjectVault('poster', 'poster1')">
        <a href="/artwork_poster.html">
        <div class="grid-image-wrapper">
            <img src="./poster/vn.jpg"style="opacity:50%;" alt="Poster Art">
        </div>
        <div class="grid-item-overlay">
            <span>POSTER Artwork</span>
        </div>
        </a>
    </div>

    <!-- Dự án 3: Product Design -->
    <div class="portfolio-grid-item" data-category="product" onclick="openProjectVault('product', 'pack1')">

    </div>

    <!-- Dự án 4: Animation -->
    <div class="portfolio-grid-item" data-category="animation" onclick="openAnimationPlayer('intro.mp4')">
        <a href="artwork_animation.html">

        </div>
        <div class="grid-item-overlay">
            <span>ANIMATION PLAY</span>
        </div></a>
    </div>

    <!-- Dự án 5: Doodle Art -->
    <div class="portfolio-grid-item" data-category="doodle" onclick="openProjectVault('doodle', 'doodle1')"><a href="/artwork_doodle.html">
        <div class="grid-image-wrapper">
            <img src="/doodle/background/color.jpg"style="opacity:50%;" alt="Doodle Art">
